<title>Dock Backer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one-screen game. Top bar (score), the yard (canvas), cab controls (steering slider + pedals). Single night-yard look. */
:root{
  --ground:#121518; --panel:#1d2226; --panel-2:#171b1e; --line:#323a40;
  --text:#eef1f3; --muted:#9aa6ae; --paint:#f2c230; --go:#3ddc84; --stop:#ff5a4e;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.brand span{color:var(--paint)}
.stats{display:flex;gap:16px;flex:1;min-width:0;font-size:12px;color:var(--muted);align-items:baseline}
.stats b{font-family:var(--mono);font-weight:500;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums;margin-right:4px}
.tools{display:flex;gap:6px;margin-left:auto}
.tbtn{font:600 12px var(--body);color:var(--text);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.tbtn[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.tbtn:focus-visible,.btn:focus-visible,.lvl:focus-visible,.pedal:focus-visible{outline:2px solid var(--paint);outline-offset:2px}

.yard{position:relative;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:6px;padding-block:8px;pointer-events:none}
.chip{font:500 11px var(--mono);background:rgba(18,21,24,.82);border:1px solid var(--line);border-radius:6px;padding:4px 7px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:var(--text);font-weight:500}
.chip.ok{border-color:#2d6045}.chip.ok b{color:var(--go)}
.chip.warn{border-color:#6a3430}.chip.warn b{color:var(--stop)}
.chip.door{background:var(--paint);color:#1a1600;border-color:var(--paint);font-weight:500}
.cb{position:absolute;z-index:5;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:grid;gap:2px;justify-items:start;pointer-events:none}
.cb>*{background:rgba(18,21,24,.92)}
.cb-tag{font:600 10px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#1a1600;background:var(--paint)!important;padding:3px 8px;border-radius:5px 5px 0 0}
.cb-text{font:600 15px var(--body);color:var(--text);padding:8px 12px;border:1px solid var(--paint);border-radius:0 10px 10px 10px;max-width:420px}
#flash{position:absolute;inset:0;background:#ff5a4e;opacity:0;pointer-events:none}
#cabhud{position:absolute;inset:0;pointer-events:none}
#cabhud svg{position:absolute;left:0;width:100%}
#cabhud .frame{top:0;height:100%}
#cabhud .cluster{bottom:0;height:34%;overflow:hidden}
#gl{filter:saturate(1.06) contrast(1.04)}
.yard.three::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.38) 100%)}
.hint{flex-basis:100%;font:600 13px var(--body);color:var(--paint);text-shadow:0 1px 3px #000}

.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,14,.6);padding-block:16px;overflow:auto}
.card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.eyebrow{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow.ok{color:var(--go)}.eyebrow.bad{color:var(--stop)}
.title{font-family:var(--display);font-weight:800;font-size:56px;line-height:.9;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.title span{color:var(--paint)}
.title.sm{font-size:32px;line-height:1}
.card p{margin:0;line-height:1.5;color:#d3d9dd;max-width:62ch}
.card .lede{font-size:15px}
.target{font:500 13px var(--mono);color:var(--muted);border-left:3px solid var(--paint);padding:6px 10px;background:var(--panel-2)}
.target b{color:var(--paint);font-weight:500}
.tip{font-size:14px}
.tip b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--paint);margin-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:800 17px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:11px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);cursor:pointer}
.btn.primary{background:var(--paint);border-color:var(--paint);color:#1a1600}
.levels{display:grid;gap:6px}
.lvl{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);cursor:pointer;font-family:var(--body)}
.lvl:hover:not(:disabled){border-color:var(--paint)}
.lvl:disabled{opacity:.45;cursor:not-allowed}
.lvl .n{font:800 22px var(--display);color:var(--paint)}
.lvl .nm{font-weight:600;font-size:14px;display:grid}
.lvl small{font-weight:400;color:var(--muted);font-size:12px}
.stars{letter-spacing:2px;font-size:15px;color:var(--line)}
.stars i{font-style:normal;color:var(--paint)}
.bigstars{font-size:40px;letter-spacing:6px;line-height:1;color:var(--line)}
.bigstars i{font-style:normal;color:var(--paint)}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.res div{background:var(--panel-2);border-radius:8px;padding:8px 10px}
.res dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.res dd{margin:2px 0 0;font:500 18px var(--mono);font-variant-numeric:tabular-nums}
.res small{font-size:12px;color:var(--muted)}
.keys{font-size:12px!important;color:var(--muted)!important}
.conds{display:grid;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg>span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);width:72px}
.seg button{font:600 12px var(--body);padding:7px 11px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paint);color:#1a1600;border-color:var(--paint)}
.seg button:focus-visible{outline:2px solid var(--paint);outline-offset:2px}

.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding-block:12px;background:var(--panel);border-top:1px solid var(--line)}
.steer{display:grid;gap:6px;min-width:0}
.track{position:relative;height:64px;border-radius:32px;background:var(--panel-2);border:1px solid var(--line);touch-action:none;cursor:grab}
.track::before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:2px;margin-left:-1px;background:var(--line)}
.knob{position:absolute;top:3px;left:calc(50% - 29px);width:58px;height:58px;border-radius:50%;background:#262d32;border:1px solid #4a545b;display:grid;place-items:center;pointer-events:none;will-change:transform}
.knob svg{width:46px;height:46px}
.steer-labels{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.center{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:5px;padding:3px 8px;cursor:pointer}
.pedals{display:grid;gap:8px}
.pedal{width:112px;height:50px;border-radius:10px;font:800 18px var(--display);letter-spacing:.1em;text-transform:uppercase;touch-action:none;cursor:pointer;-webkit-touch-callout:none}
.pedal.fwd{background:#1b3226;color:var(--go);border:1px solid #2d6045}
.pedal.rev{background:#371f1d;color:#ff8a7f;border:1px solid #6a3430}
.pedal.on{filter:brightness(1.6);transform:translateY(1px)}
@media (max-width:420px){
  .brand{display:none}
  .pedal{width:96px}
  .title{font-size:46px}
}
@media (prefers-reduced-motion:reduce){.pedal.on{transform:none}}
</style>

<div class="app">
  <header class="bar gutter">
    <div class="brand">Dock <span>Backer</span></div>
    <div class="tools">
      <button class="tbtn" id="viewBtn" title="Change the camera (V key)">Map</button>
      <button class="tbtn" id="restartBtn" title="Start this level over (R key)">Restart</button>
      <button class="tbtn" id="guideBtn" aria-pressed="true" title="Show where the back of the trailer goes if you reverse now">Guide</button>
      <button class="tbtn" id="soundBtn" aria-pressed="true">Sound</button>
      <button class="tbtn" id="menuBtn">Levels</button>
    </div>
  </header>

  <main class="yard" id="yard">
    <canvas id="cv" aria-label="Truck yard seen from above"></canvas>
    <canvas id="gl" aria-label="Truck yard in 3D" hidden></canvas>
    <div id="flash"></div>
    <div id="cabhud" hidden aria-hidden="true">
      <svg class="frame" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="M0 0H100V8Q50 12 0 8Z" fill="#121518"/>
        <path d="M18 8.6Q50 11.8 82 8.6L80 13Q50 15.5 20 13Z" fill="#1d2227"/>
        <path d="M0 0L3.2 0L1.8 60L0 62Z" fill="#191d21"/>
        <path d="M100 0L96.8 0L98.2 60L100 62Z" fill="#191d21"/>
        <path d="M0 76Q50 67 100 76V100H0Z" fill="#1f2327"/>
        <path d="M0 76Q50 67 100 76" stroke="#3a4147" stroke-width=".5" fill="none" vector-effect="non-scaling-stroke"/>
        <path d="M0 84Q50 78 100 84V100H0Z" fill="#191c20"/>
      </svg>
      <svg class="cluster" viewBox="0 0 400 230" preserveAspectRatio="xMidYMax meet">
        <rect x="60" y="34" width="280" height="118" rx="26" fill="#0d0f11" stroke="#2c3237" stroke-width="2"/>
        <g id="gTach" transform="translate(128 96)"></g>
        <g id="gSpeed" transform="translate(272 96)"></g>
        <g id="gAir" transform="translate(200 70)"></g>
        <g id="gFuel" transform="translate(200 122)"></g>
        <rect x="178" y="152" width="44" height="26" rx="5" fill="#0d0f11" stroke="#2c3237"/>
        <text id="gGear" x="200" y="171" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="17" fill="#3ddc84">N</text>
        <g id="gWheel">
          <circle cx="200" cy="350" r="196" fill="none" stroke="#151719" stroke-width="30"/>
          <circle cx="200" cy="350" r="196" fill="none" stroke="#2b2f33" stroke-width="2" stroke-dasharray="3 9"/>
          <path d="M200 350L64 236M200 350L336 236" stroke="#1a1d20" stroke-width="26" stroke-linecap="round"/>
          <circle cx="200" cy="350" r="62" fill="#1a1d20"/>
          <circle cx="200" cy="350" r="46" fill="#24282c" stroke="#3a4046"/>
          <rect x="196" y="150" width="8" height="12" rx="2" fill="#f2c230"/>
        </g>
      </svg>
    </div>
    <div class="hud gutter" id="hud"></div>
    <div class="cb" id="cb" hidden aria-live="polite"><span class="cb-tag">Yard radio · Channel 19</span><span class="cb-text"></span></div>
    <div class="overlay gutter" id="overlay" hidden><div class="card" id="card" role="dialog" aria-live="polite"></div></div>
  </main>

  <footer class="controls gutter">
    <div class="steer">
      <div class="track" id="track" aria-label="Steering. Drag left or right.">
        <div class="knob" id="knob">
          <svg viewBox="-24 -24 48 48" id="wheel" aria-hidden="true">
            <circle r="20" fill="none" stroke="#c9d1d6" stroke-width="4"/>
            <circle r="5" fill="#c9d1d6"/>
            <path d="M-19 -2 L-5 -1 M19 -2 L5 -1 M0 5 L0 19" stroke="#c9d1d6" stroke-width="4" stroke-linecap="round"/>
            <circle cy="-20" r="2.5" fill="#f2c230"/>
          </svg>
        </div>
      </div>
      <div class="steer-labels"><span>◀ Left</span><button class="center" id="centerBtn">Center wheel</button><span>Right ▶</span></div>
    </div>
    <div class="pedals">
      <button class="pedal fwd" id="fwd">Forward</button>
      <button class="pedal rev" id="rev">Reverse</button>
    </div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const DEG=Math.PI/180, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));

// World in meters (y points down the screen).
const W=44, H=56;
// Tractor: kingpin sits on the drive axles. Trailer: kingpin to trailer axles L2.
const L1=4.0, L2=10.5, TF=1.0, TR=2.4, THW=1.3, CF=5.2, CR=1.6, CHW=1.25;
const MAXD=36*DEG, JACK=75*DEG, STEER_RATE=70*DEG, VF=5.5, VR=-1.8;
const TOL={gap:.5, lat:.5, ang:5*DEG};
const M2FT=3.281;
const TINTS=['#d9dde0','#c9d0d6','#e3e1da','#cfd6d2','#d4d4dc','#dde3e6'];
const CARS=['#b8bcc2','#2b2f36','#8a1c1c','#e5e5e0','#3d5a80','#6b6f45','#c9a227','#4a4a52','#1f4e45','#9aa0a6'];

const TIMES={
  day:  {asphalt:'#4f555a',walk:'#b4b3ab',joint:'rgba(0,0,0,.15)',paint:'#f4cc3a',lights:false,dark:0,  tint:'rgba(255,245,215,.04)'},
  dusk: {asphalt:'#2f2d31',walk:'#6d6660',joint:'rgba(0,0,0,.22)',paint:'#f2c230',lights:true, dark:.3, tint:'rgba(255,120,70,.09)'},
  night:{asphalt:'#1d2225',walk:'#3b4044',joint:'rgba(0,0,0,.3)', paint:'#f2c230',lights:true, dark:.58,tint:null}
};
const TIME_NAMES={day:'Day',dusk:'Dusk',night:'Night'}, WX_NAMES={clear:'Clear',rain:'Rain',fog:'Fog',snow:'Snow'};
function shadeHex(hex,f){const n=parseInt(hex.slice(1),16), c=v=>Math.max(0,Math.min(255,Math.round(v*f))); return '#'+[(n>>16)&255,(n>>8)&255,n&255].map(v=>c(v).toString(16).padStart(2,'0')).join('');}
function makeTheme(time,wx){
  const t=Object.assign({time,wx},TIMES[time]);
  if(wx==='rain'){t.asphalt=shadeHex(t.asphalt,.72); t.walk=shadeHex(t.walk,.78); t.wet=true; t.tint='rgba(60,80,110,.12)'; if(time==='day') t.dark=.12;}
  if(wx==='snow'){t.snow=true; t.tint='rgba(150,180,230,.07)'; t.walk=shadeHex(t.walk,1.15); t.paint='#e8c547';}
  if(wx==='fog'){t.fog=true; if(time==='day') t.dark=.06;}
  t.shadow=time==='night'?.45:.38;
  return t;
}

// ---------- geometry ----------
function rect(px,py,a,front,back,hw){
  const c=Math.cos(a), s=Math.sin(a), nx=-s, ny=c;
  return [[px+c*front+nx*hw,py+s*front+ny*hw],[px+c*front-nx*hw,py+s*front-ny*hw],
          [px-c*back-nx*hw,py-s*back-ny*hw],[px-c*back+nx*hw,py-s*back+ny*hw]];
}
const AR=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
const axle=t=>[t.x-L2*Math.cos(t.ph), t.y-L2*Math.sin(t.ph)];
const trailerPoly=t=>{const [a,b]=axle(t); return rect(a,b,t.ph,L2+TF,TR,THW)};
const tractorPoly=t=>rect(t.x,t.y,t.th,CF,CR,CHW);
function overlap(A,B){
  for(const P of [A,B]) for(let i=0;i<P.length;i++){
    const p=P[i], q=P[(i+1)%P.length], ax=q[1]-p[1], ay=p[0]-q[0];
    let a1=Infinity,a2=-Infinity,b1=Infinity,b2=-Infinity;
    for(const v of A){const d=v[0]*ax+v[1]*ay; if(d<a1)a1=d; if(d>a2)a2=d;}
    for(const v of B){const d=v[0]*ax+v[1]*ay; if(d<b1)b1=d; if(d>b2)b2=d;}
    if(a2<b1||b2<a1) return false;
  }
  return true;
}
function rearOf(t){const [ax,ay]=axle(t); return [ax-TR*Math.cos(t.ph), ay-TR*Math.sin(t.ph)];}
// Where the back of the trailer sits against a goal point facing a goal direction.
function frame(t,px,py,ang){
  const [rx,ry]=rearOf(t), nx=Math.cos(ang), ny=Math.sin(ang), dx=rx-px, dy=ry-py;
  const lat=dx*-ny+dy*nx;
  return {gap:dx*nx+dy*ny, lat:Math.abs(lat), slat:lat, ang:Math.abs(wrap(t.ph-ang)), sang:wrap(t.ph-ang)};
}
// a little slack, like a real yard checker: about a foot past the painted lines still counts
const ZONE_SLACK_W=.35, ZONE_SLACK_L=.5, ZONE_TRAILER_ANG=4*DEG, ZONE_TRACTOR_ANG=10*DEG;
function inZone(poly,z){
  const u=[Math.cos(z.ang),Math.sin(z.ang)];
  return poly.every(p=>{const dx=p[0]-z.cx, dy=p[1]-z.cy; return Math.abs(dx*u[0]+dy*u[1])<=z.len/2+ZONE_SLACK_L && Math.abs(-dx*u[1]+dy*u[0])<=z.wid/2+ZONE_SLACK_W;});
}
function zoneStatus(t){
  const T=S.target, ti=inZone(trailerPoly(t),T), ci=T.trailerOnly||inZone(tractorPoly(t),T);
  const straight=Math.abs(wrap(t.ph-T.ang))<ZONE_TRAILER_ANG&&(T.trailerOnly||Math.abs(wrap(t.th-T.ang))<ZONE_TRACTOR_ANG);
  return {ti,ci,straight,stopped:t.v===0};
}

// ---------- places ----------
function base(time,wx,edgeMsg){return {time,wx,edgeMsg,top:0,solids:[],soft:[],doors:[],lights:[],paint:null,decor:null,fence:false};}
function bldg(S,x0,y0,x1,y1,label,style,color,dock){S.solids.push({poly:AR(x0,y0,x1,y1),box:[x0,y0,x1,y1],kind:'bldg',label,style,color,dock:!!dock});}
function curb(S,x0,y0,x1,y1){S.soft.push({poly:AR(x0,y0,x1,y1),box:[x0,y0,x1,y1],kind:'curb',label:'the curb'});}
function car(S,x,y,ang,i){S.solids.push({poly:rect(x,y,ang*DEG,2.3,2.3,.95),kind:'car',x,y,ang:ang*DEG,color:CARS[i%CARS.length],label:'a parked car'});}
function parkedAt(d,i,label){
  const c=Math.cos(d.ang), s=Math.sin(d.ang), ax=d.x+c*(TR+.15), ay=d.y+s*(TR+.15);
  return {poly:rect(ax,ay,d.ang,L2+TF,TR,THW),kind:'trailer',ax,ay,ang:d.ang,color:TINTS[i%TINTS.length],label:label||`the trailer at ${d.label}`};
}
function doorRow(S,y,prefix,first,xs){xs.forEach((x,i)=>S.doors.push({x,y,ang:-90*DEG,label:prefix+(first+i),num:first+i}));}
const byNum=(S,n)=>S.doors.find(d=>d.num===n);

function sceneGrocery(o){
  const S=base('night','clear','Ran into the yard fence.'); S.fence=true;
  bldg(S,0,51,W,56,'the warehouse wall','warehouse','#2a3136',true);
  doorRow(S,51,'Door ',11,[10,14,18,22,26,30,34]);
  o.park.forEach((n,i)=>S.solids.push(parkedAt(byNum(S,n),i)));
  S.target={type:'dock',door:byNum(S,o.door)};
  S.lights=[[4,30],[40,30],[22,6]];
  S.paint=g=>{stallLines(g,S); oil(g,S);};
  S.decor=g=>{ // guard shack and a row of empty trailers waiting at the top fence
    g.fillStyle='#3a4248'; g.fillRect(1,1,4,3); g.fillStyle='#ffd98a'; g.fillRect(1.4,1.4,1.2,.5);
  };
  return S;
}
function sceneLA(){
  const S=base('dusk','clear','Ran into the fence.'); S.fence=true; S.top=6;
  bldg(S,0,51,W,56,'the market building','warehouse','#3b3f44',true);

  }
}catch(e){}

const starsOf=i=>save.stars[LEVELS[i].id]||0;
const unlocked=i=>i===0||starsOf(i-1)>0||starsOf(i)>0;

// ---------- state ----------
let li=0, L, S, truck, game={mode:'menu'};

function setupScene(i){
  li=i; L=LEVELS[i]; S=L.build();
  const c=save.cond[L.id]||{}; S.T=makeTheme(c.time||S.time,c.wx||S.wx);

function goalFrame(t){
  const T=S.target;
  if(T.type==='dock') return frame(t,T.door.x,T.door.y,T.door.ang);
  return frame(t,T.p[0],T.p[1],T.ang);
}
function dockAligned(t){
  for(const d of S.doors){const m=frame(t,d.x,d.y,d.ang); if(m.lat<.9&&m.ang<12*DEG&&m.gap<1.2) return d;}
  return null;
}
function won(t){
  const T=S.target;
  if(T.type==='dock'){const m=goalFrame(t); return m.gap<TOL.gap&&m.lat<TOL.lat&&m.ang<TOL.ang;}
  const z=zoneStatus(t); return z.ti&&z.ci&&z.straight;
}

// ---------- physics ----------
function check(t){
  if(Math.abs(wrap(t.th-t.ph))>JACK) return {crash:'Jackknifed. The trailer folded too far against the tractor.'};
  const tp=trailerPoly(t), cp=tractorPoly(t);
  for(const p of tp.concat(cp)) if(p[0]<0||p[0]>W||p[1]<S.top||p[1]>H) return {crash:S.edgeMsg};
  for(const s of S.soft){
    const hit=overlap(tp,s.poly)||overlap(cp,s.poly);

    else if(!hit) s.in=false;
  }
  for(const s of S.solids){
    if(overlap(cp,s.poly)) return {crash:`The tractor hit ${s.label}.`};
    if(overlap(tp,s.poly)){
      if(s.dock){
        const d=dockAligned(t);
        if(d&&S.target.type==='dock'&&d===S.target.door) return {bumper:true};
        if(d) return {crash:`Wrong door. This load goes to ${S.target.door.label}.`};

}

function physics(dt){
  const f=keys.f||pedal.f, r=keys.r||pedal.r;
  const dir=f&&!r?1:r&&!f?-1:0;
  if(keys.l) truck.delta-=STEER_RATE*dt;
  if(keys.rt) truck.delta+=STEER_RATE*dt;
  truck.delta=clamp(truck.delta,-MAXD,MAXD);
  const tgt=dir===1?VF:dir===-1?VR:0;
  if(dir===0||truck.v*dir<0){const b=(S.T.wet||S.T.snow?4.2:7)*dt; truck.v=Math.abs(truck.v)<=b?0:truck.v-Math.sign(truck.v)*b;}
  else {const a=3.0*dt; truck.v+=clamp(tgt-truck.v,-a,a);}
  if(truck.v===0) return;
  game.started=true;
  const n=Math.max(1,Math.ceil(Math.abs(truck.v*dt)/.03)), h=dt/n;
  for(let i=0;i<n;i++){
    const prev=Object.assign({},truck);
    truck.x+=truck.v*Math.cos(truck.th)*h;
    truck.y+=truck.v*Math.sin(truck.th)*h;
    truck.th+=truck.v/L1*Math.tan(truck.delta)*h;
    truck.ph+=truck.v/L2*Math.sin(truck.th-truck.ph)*h;
    const res=check(truck);
    if(res.crash){fail(res.crash); return;}
    if(res.bumper){
      const hit=Math.abs(prev.v);
      Object.assign(truck,prev); truck.v=0;
      if(!game.bumped){ sfx('bump'); if(hit>1.2){game.pen++; game.hint='Hit the dock hard. Ease off before the bumpers next time.'; game.hintHold=2.5; heckle('bump');} }
      game.bumped=true; break;
    }
  }
}

function post(dt){
  const d=truck.v>.15?1:truck.v<-.15?-1:0;
  if(d&&d!==game.lastDir){ if(d===1&&game.reversed){game.pullups++; if(game.pullups>L.par||Math.random()<.35) heckle('pullup');} if(d===-1) game.reversed=true; game.lastDir=d; }
  if(game.started) game.time+=dt;
  if(L.limit){const left=L.limit-game.time; if(left<=30&&!game.warned){game.warned=true; heckle('slow');} if(left<=0){fail('Missed your appointment. The receiver gave your door to another truck.','late'); return;}}
  if(Math.abs(truck.v)>.4) game.moving=true;
  if(truck.v===0&&game.moving){game.moving=false; sfx('air');}
  const m=goalFrame(truck), hitch=Math.abs(wrap(truck.th-truck.ph));
  if(m.gap>.6) game.bumped=false;
  if(truck.v===0&&won(truck)){win(); return;}
  if(game.hintHold>0){game.hintHold-=dt; return;}
  if(S.target.type==='dock'){
    if(m.gap<.8&&truck.v===0&&m.lat<TOL.lat&&m.ang<TOL.ang) game.hint='Almost there. Back up a little more to reach the bumpers.';
    else if(m.gap<.6&&truck.v===0) game.hint='At the dock but not lined up. Pull forward and straighten out.';
    else if(hitch>55*DEG) game.hint='Sharp angle. Pull forward to straighten before you jackknife.';
    else game.hint='';
  } else {
    const z=zoneStatus(truck), box=S.target.trailerOnly?'stall':'box';
    if(hitch>55*DEG) game.hint='Sharp angle. Pull forward to straighten before you jackknife.';
    else if(z.ti&&z.ci&&z.straight) game.hint='In and straight. Stop to finish.';
    else if(z.ti&&z.ci) game.hint=`You're in the ${box}. Straighten the truck to finish.`;
    else if(z.ti&&!z.ci) game.hint='Trailer is in. Now get the tractor inside the box too.';
    else if(game.time<10) game.hint=S.target.trailerOnly?'Goal: back the trailer into the green stall, straight, then stop.':'Goal: get the whole truck inside the green box, straight, then stop.';
    else game.hint='';
  }
  if(game.hint!==game.lastHint){ if(game.hint.startsWith('At the dock but')) heckle('miss'); else if(game.hint.startsWith('Sharp angle')) heckle('hitch'); game.lastHint=game.hint; }
}

function projectPath(){
  let x=truck.x,y=truck.y,th=truck.th,ph=truck.ph;
  const td=Math.tan(truck.delta), ds=.25, mid=[], a=[], b=[];
  for(let i=0;i<72;i++){
    x-=Math.cos(th)*ds; y-=Math.sin(th)*ds; th-=ds/L1*td; ph-=ds/L2*Math.sin(th-ph);
    if(Math.abs(wrap(th-ph))>JACK) break;
    const c=Math.cos(ph), s=Math.sin(ph), ax=x-L2*c, ay=y-L2*s, rx=ax-TR*c, ry=ay-TR*s;
    mid.push([rx,ry]); a.push([rx-s*THW,ry+c*THW]); b.push([rx+s*THW,ry-c*THW]);
    if(ry>H||ry<0||rx<0||rx>W) break;
  }
  return {mid,a,b};
}

  if(T.lights) for(const [x,y] of S.lights){g.save(); shade(g,.3,1.6,.5); g.fillStyle='#2b3034'; g.beginPath(); g.arc(x,y,.22,0,6.283); g.fill(); g.restore(); g.fillStyle='#ffe2a8'; g.beginPath(); g.arc(x,y,.12,0,6.283); g.fill();}
  if(T.wet){
    const R2=rnd(li*7+2);
    for(let i=0;i<26;i++){const x=R2()*W, y=R2()*H, rx=1+R2()*3, ry=.5+R2()*1.4, gr=g.createRadialGradient(x,y,0,x,y,rx);
      gr.addColorStop(0,'rgba(150,175,200,.16)'); gr.addColorStop(1,'rgba(150,175,200,0)'); g.save(); g.translate(x,y); g.scale(1,ry/rx); g.translate(-x,-y); g.fillStyle=gr; g.fillRect(x-rx,y-rx,rx*2,rx*2); g.restore();}
    if(T.lights) for(const [x,y] of S.lights){const gr=g.createLinearGradient(x,y,x,y+9); gr.addColorStop(0,'rgba(255,200,120,.22)'); gr.addColorStop(1,'rgba(255,200,120,0)'); g.fillStyle=gr; g.fillRect(x-.5,y,1,9);}
  }
  if(T.snow){
    const R3=rnd(li*5+1);
    for(let i=0;i<60;i++){const x=R3()*W, y=R3()*H, r=1.5+R3()*3.5, gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba(235,242,248,.28)'); gr.addColorStop(1,'rgba(235,242,248,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,2*r,2*r);}
  }
  if(T.tint){g.fillStyle=T.tint; g.fillRect(0,0,W,H);}
  g.restore();
  // vignette
  g.setTransform(1,0,0,1,0,0);
  const vg=g.createRadialGradient(st.width/2,st.height/2,Math.min(st.width,st.height)*.35,st.width/2,st.height/2,Math.max(st.width,st.height)*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.35)'); g.fillStyle=vg; g.fillRect(0,0,st.width,st.height);
}

// ---------- weather, exhaust and night light ----------
const puffs=[], flakes=[], clouds=[], drops=[], splashes=[], lc=document.createElement('canvas'), fc=document.createElement('canvas');
function resetFx(){
  puffs.length=0; flakes.length=0; clouds.length=0; drops.length=0; splashes.length=0;
  const R=rnd(li+3);
  if(TH().snow) for(let i=0;i<170;i++) flakes.push({x:R()*W,y:R()*H,s:.05+R()*.09,v:1.2+R()*1.8,d:R()*6});
  if(!TH().lights&&!TH().wet&&!TH().fog) for(let i=0;i<3;i++) clouds.push({x:R()*W*1.5-10,y:R()*H,r:10+R()*8});
  if(TH().wet) for(let i=0;i<240;i++) drops.push({x:R()*W,y:R()*H,l:.6+R()*.7,v:20+R()*8});
}
const toWorld=(t,lx,ly)=>[t.x+Math.cos(t.th)*lx-Math.sin(t.th)*ly, t.y+Math.sin(t.th)*lx+Math.cos(t.th)*ly];
function fx(dt){
  const thr=game.mode==='play'&&(keys.f||keys.r||pedal.f||pedal.r);
  game.puffT=(game.puffT||0)-dt;
  if((game.mode==='play'||game.mode==='brief')&&game.puffT<=0&&!reduceMotion){
    game.puffT=thr?.05:.35;
    const sx2=cabGeom(truck.style||PARKED_STYLE).s0-.07; for(const s of (truck.style&&truck.style.stacks===1?[1]:[-1,1])){const [x,y]=toWorld(truck,sx2,s*1.13); puffs.push({x,y,r:.15,a:thr?.45:.18,vx:.35+Math.random()*.3,vy:-.25-Math.random()*.3});}
    if(puffs.length>90) puffs.splice(0,puffs.length-90);
  }
  for(const p of puffs){p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=.9*dt; p.a-=.38*dt;}
  while(puffs.length&&puffs[0].a<=0) puffs.shift();
  for(const f of flakes){f.y+=f.v*dt; f.x+=(.5+Math.sin(performance.now()/900+f.d)*.4)*dt; if(f.y>H){f.y=0; f.x=Math.random()*W;} if(f.x>W) f.x=0;}
  for(const c of clouds){c.x+=.5*dt; if(c.x-c.r>W) c.x=-c.r;}
  for(const d of drops){d.y+=d.v*dt; d.x+=d.v*.18*dt; if(d.y>H){d.y-=H; d.x=Math.random()*W;} if(d.x>W) d.x-=W;}
  if(drops.length&&!reduceMotion) for(let i=0;i<3;i++) splashes.push({x:Math.random()*W,y:Math.random()*H,r:.05,a:.5});
  for(const p of splashes){p.r+=1.4*dt; p.a-=1.6*dt;}
  while(splashes.length&&splashes[0].a<=0) splashes.shift();
}
function lighting(g){
  const dark=TH().dark; if(!dark) return;
  if(lc.width!==cv.width||lc.height!==cv.height){lc.width=cv.width; lc.height=cv.height;}
  const l=lc.getContext('2d');
  l.setTransform(1,0,0,1,0,0); l.globalCompositeOperation='source-over'; l.clearRect(0,0,lc.width,lc.height);
  l.fillStyle=`rgba(5,9,20,${dark})`; l.fillRect(0,0,lc.width,lc.height);
  l.setTransform(view.k,0,0,view.k,view.ox,view.oy); l.globalCompositeOperation='destination-out';
  const hole=(x,y,r,a)=>{const gr=l.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,`rgba(0,0,0,${a})`); gr.addColorStop(1,'rgba(0,0,0,0)'); l.fillStyle=gr; l.fillRect(x-r,y-r,2*r,2*r);};
  for(const [x,y] of S.lights) hole(x,y,13,.92);
  for(const d of S.doors){const nx=Math.cos(d.ang), ny=Math.sin(d.ang); hole(d.x+nx*1.5,d.y+ny*1.5,3.2,.55);}
  hole(truck.x,truck.y,4.5,.3);
  const cone=(x,y,a,len,w0,w1,al)=>{l.save(); l.translate(x,y); l.rotate(a); const gr=l.createLinearGradient(0,0,len,0); gr.addColorStop(0,`rgba(0,0,0,${al})`); gr.addColorStop(1,'rgba(0,0,0,0)'); l.fillStyle=gr; l.beginPath(); l.moveTo(0,-w0); l.lineTo(len,-w1); l.lineTo(len,w1); l.lineTo(0,w0); l.closePath(); l.fill(); l.restore();};
  const [fx2,fy2]=toWorld(truck,5.2,0); cone(fx2,fy2,truck.th,13,1,4.5,.95);
  if(truck.v<-.02){const [rx,ry]=rearOf(truck); cone(rx,ry,truck.ph+Math.PI,7,1.2,3,.8);}
  g.save(); g.setTransform(1,0,0,1,0,0); g.drawImage(lc,0,0); g.restore();
  // tail lights and headlight glints on top of the dark
  g.save(); g.globalCompositeOperation='lighter';
  const glow=(x,y,r,c)=>{const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,c); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,2*r,2*r);};
  const c=Math.cos(truck.ph), s=Math.sin(truck.ph), [rx,ry]=rearOf(truck), brake=truck.v===0||!(keys.r||pedal.r||keys.f||pedal.f);
  for(const k of [-1,1]) glow(rx-s*k*1.05,ry+c*k*1.05,brake?1.1:.7,brake?'rgba(255,40,30,.55)':'rgba(255,40,30,.3)');
  for(const k of [-1,1]){const [hx,hy]=toWorld(truck,5.15,k*.8); glow(hx,hy,.8,'rgba(255,240,200,.5)');}
  if(truck.style&&truck.style.lightBar){const G2=cabGeom(truck.style); for(const k of [-.8,0,.8]){const [lx,ly]=toWorld(truck,G2.w0-.09,k); glow(lx,ly,.5,'rgba(255,180,60,.35)');}}
  g.restore();
}

function draw(ts){
  const g=ctx;
  g.setTransform(1,0,0,1,0,0); g.drawImage(st,0,0);
  if(!S) return;
  g.setTransform(view.k,0,0,view.k,view.ox,view.oy);
  const pulse=reduceMotion?.7:.5+.5*Math.sin(ts/280), T=S.target;
  for(const c of S.soft) if(c.kind==='cone'){
    g.save(); g.translate(c.x,c.y);
    if(c.hit){g.rotate(c.rot||1); g.fillStyle='#ff8a1f'; g.beginPath(); g.moveTo(-.1,-.15); g.lineTo(.55,0); g.lineTo(-.1,.15); g.fill();}
    else {g.fillStyle='#ff8a1f'; g.beginPath(); g.arc(0,0,.32,0,6.283); g.fill(); g.fillStyle='#fff'; g.beginPath(); g.arc(0,0,.17,0,6.283); g.fill();}
    g.restore();
  }
  const [ax,ay]=axle(truck);
  drawTractor(g,truck);
  drawTrailer(g,ax,ay,truck.ph,'#e4e8eb',true);
  drawCab(g,truck);
  const smoke=truck.style&&truck.style.rust?'40,40,38':'70,72,74';
  for(const p of puffs){g.fillStyle=`rgba(${smoke},${Math.max(0,p.a)})`; g.beginPath(); g.arc(p.x,p.y,p.r,0,6.283); g.fill();}
  for(const c of clouds){const gr=g.createRadialGradient(c.x,c.y,0,c.x,c.y,c.r); gr.addColorStop(0,'rgba(20,30,40,.12)'); gr.addColorStop(1,'rgba(20,30,40,0)'); g.fillStyle=gr; g.fillRect(c.x-c.r,c.y-c.r,c.r*2,c.r*2);}
  lighting(g);
  if(TH().fog){
    if(fc.width!==cv.width||fc.height!==cv.height){fc.width=cv.width; fc.height=cv.height;}
    const f=fc.getContext('2d'), night=TH().time!=='day';
    f.setTransform(1,0,0,1,0,0); f.globalCompositeOperation='source-over'; f.clearRect(0,0,fc.width,fc.height);
    f.fillStyle=night?'rgba(70,78,88,.78)':'rgba(196,202,208,.8)'; f.fillRect(0,0,fc.width,fc.height);
    f.setTransform(view.k,0,0,view.k,view.ox,view.oy); f.globalCompositeOperation='destination-out';
    const [rx,ry]=rearOf(truck), mx=(truck.x+rx)/2, my=(truck.y+ry)/2;
    for(const [x,y,r] of [[mx,my,17],[rx,ry,9],[truck.x,truck.y,9]]){const gr=f.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba(0,0,0,.92)'); gr.addColorStop(1,'rgba(0,0,0,0)'); f.fillStyle=gr; f.fillRect(x-r,y-r,2*r,2*r);}
    g.save(); g.setTransform(1,0,0,1,0,0); g.drawImage(fc,0,0); g.restore();
  }
  g.setTransform(view.k,0,0,view.k,view.ox,view.oy);
  // the goal and the guide stay readable on top of the dark
  g.strokeStyle=`rgba(61,220,132,${.45+.45*pulse})`; g.fillStyle=`rgba(61,220,132,${.05+.06*pulse})`; g.lineWidth=.14; g.setLineDash([.7,.45]);
  if(T.type==='dock'){
    const d=T.door; g.save(); g.translate(d.x,d.y); g.rotate(d.ang); g.fillRect(0,-1.8,15,3.6); g.strokeRect(0,-1.8,15,3.6); g.restore();
    const nx=Math.cos(d.ang), ny=Math.sin(d.ang), lx=d.x+ny*2-nx*.9, ly=d.y-nx*2-ny*.9;
    const gr=g.createRadialGradient(lx,ly,0,lx,ly,2.2); gr.addColorStop(0,`rgba(61,220,132,${.35+.25*pulse})`); gr.addColorStop(1,'rgba(61,220,132,0)'); g.fillStyle=gr; g.fillRect(lx-2.2,ly-2.2,4.4,4.4);
    g.fillStyle='#3ddc84'; g.beginPath(); g.arc(lx,ly,.24,0,6.283); g.fill();
  } else {
    g.save(); g.translate(T.cx,T.cy); g.rotate(T.ang); g.fillRect(-T.len/2,-T.wid/2,T.len,T.wid); g.strokeRect(-T.len/2,-T.wid/2,T.len,T.wid); g.restore();
  }
  g.setLineDash([]);
  if(save.guide&&(game.mode==='play'||game.mode==='brief')){
    const p=projectPath();
    g.strokeStyle='rgba(242,194,48,.35)'; g.lineWidth=.07;
    for(const ln of [p.a,p.b]){if(ln.length<2) continue; g.beginPath(); g.moveTo(ln[0][0],ln[0][1]); for(const q of ln) g.lineTo(q[0],q[1]); g.stroke();}
    g.fillStyle='rgba(242,194,48,.95)';
    p.mid.forEach((q,i)=>{if(i%3===0){g.beginPath(); g.arc(q[0],q[1],.13,0,6.283); g.fill();}});
  }
  if(drops.length){
    g.strokeStyle='rgba(200,215,232,.38)'; g.lineWidth=.045; g.beginPath();
    for(const d of drops){g.moveTo(d.x,d.y); g.lineTo(d.x-d.l*.18,d.y-d.l);} g.stroke();
    for(const p of splashes){g.strokeStyle=`rgba(210,225,240,${Math.max(0,p.a)})`; g.lineWidth=.04; g.beginPath(); g.arc(p.x,p.y,p.r,0,6.283); g.stroke();}
  }
  if(flakes.length){g.fillStyle='rgba(245,250,255,.85)'; for(const f of flakes){g.beginPath(); g.arc(f.x,f.y,f.s,0,6.283); g.fill();}}
}

// ---------- UI ----------
const hud=$('#hud'), overlayEl=$('#overlay'), card=$('#card'), knob=$('#knob'), wheel=$('#wheel'), track=$('#track');
const fmt=s=>{s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const starStr=(n,cls)=>`<span class="${cls||'stars'}" aria-label="${n} of 3 stars">${[0,1,2].map(i=>i<n?'<i>★</i>':'★').join('')}</span>`;
const pl=n=>`${n} pull-up${n===1?'':'s'}`;

let hudTick=0;
function updateUI(){
  updateKnob();
  if(!S) return;
  if(++hudTick%6) return;
  const hitch=Math.abs(wrap(truck.th-truck.ph))/DEG, T=S.target;
  const chip=(label,val,ok,warn)=>`<span class="chip${ok?' ok':warn?' warn':''}">${label} <b>${val}</b></span>`;
  let h=`<span class="chip door">${T.type==='dock'?T.door.label:T.label}</span>`+
    chip(L.limit?'Appointment':'Time',L.limit?fmt(Math.max(0,L.limit-(game.time||0)))+' left':fmt(game.time||0),false,L.limit&&L.limit-(game.time||0)<30)+chip('Pull-ups',(game.pullups||0)+'/'+L.par,false,game.pullups>L.par);
  if(T.type==='dock'){
    const m=goalFrame(truck);
    h+=chip('Gap',(Math.max(0,m.gap)*M2FT).toFixed(1)+' ft',m.gap<TOL.gap)+chip('Off center',(m.lat*M2FT*12).toFixed(0)+' in',m.lat<TOL.lat)+chip('Angle',(m.ang/DEG).toFixed(0)+'°',m.ang<TOL.ang);
  } else {
    const z=zoneStatus(truck), ck=v=>v?'✓':'✗';
    h+=chip('Trailer in',ck(z.ti),z.ti,!z.ti)+(T.trailerOnly?'':chip('Tractor in',ck(z.ci),z.ci,!z.ci))+chip('Straight',ck(z.straight),z.straight,!z.straight)+chip('Stopped',z.stopped?'✓':'–',z.stopped);
  }
  h+=chip('Hitch',hitch.toFixed(0)+'°',false,hitch>55)+(game.hint&&game.mode==='play'?`<span class="hint">${game.hint}</span>`:'');
  hud.innerHTML=h;
}
function updateKnob(){
  if(!truck) return;
  const d=truck.delta/MAXD, half=(track.clientWidth-60)/2;
  knob.style.transform=`translateX(${d*half}px)`;
  wheel.style.transform=`rotate(${d*450}deg)`;
}

function overlay(html){card.innerHTML=html; overlayEl.hidden=false; const b=card.querySelector('.btn.primary,.lvl:not(:disabled)'); if(b) b.focus({preventScroll:true});}
function hideOverlay(){overlayEl.hidden=true;}

function showMenu(){

function win(){
  game.mode='done'; truck.v=0;
  const s=game.pullups<=L.par&&game.pen===0?3:game.pullups<=L.par+2&&game.pen<=1?2:1;
  if(s>starsOf(li)){save.stars[L.id]=s; persist();}
  sfx('win'); heckle(s===3?'win':'sloppy',true);
  const next=li<LEVELS.length-1, T=S.target;
  const acc=T.type==='dock'?`${(goalFrame(truck).lat*M2FT*12).toFixed(1)} in`:`${(Math.abs(wrap(truck.ph-T.ang))/DEG).toFixed(1)}°`;
  overlay(`<div class="eyebrow ok">${T.type==='dock'?'Docked at '+T.door.label:'Parked in the loading zone'} · ${L.city}</div>
    ${starStr(s,'bigstars')}
    <dl class="res">
      <div><dt>Time</dt><dd>${fmt(game.time)}${L.limit?` <small>of ${fmt(L.limit)}</small>`:''}</dd></div>
      <div><dt>Pull-ups</dt><dd>${game.pullups} <small>par ${L.par}</small></dd></div>
      <div><dt>${T.type==='dock'?'Off center':'Off straight'}</dt><dd>${acc}</dd></div>
      <div><dt>Touches</dt><dd>${game.pen} <small>curbs, cones, hard bumps</small></dd></div>
    </dl>
    ${next&&tierOf(li+1)!==tierOf(li)?`<p class="tip"><b>New truck</b>Next stop you get the ${TRUCKS[tierOf(li+1)].name}.</p>`:''}
    ${next?'':'<p>That was the last stop. Go back and get 3 stars everywhere.</p>'}
    <div class="row">${next?'<button class="btn primary" data-act="next">Next stop</button>':''}<button class="btn${next?'':' primary'}" data-act="retry">Retry</button><button class="btn" data-act="menu">Levels</button></div>`);
}
function fail(reason,kind){
  game.mode='fail'; truck.v=0; game.flash=1; sfx('crash');
  heckle(kind||(reason.startsWith('Jackknifed')?'jack':'crash'),true);
  setTimeout(()=>{ if(game.mode!=='fail') return;
    overlay(`<div class="eyebrow bad">Stop · ${L.city}</div><h2 class="title sm">${reason}</h2>
      <p>Time ${fmt(game.time)} · ${pl(game.pullups)}</p>
      <div class="row"><button class="btn primary" data-act="retry">Try again</button><button class="btn" data-act="menu">Levels</button></div>`);
  },650);
}
function load(i){setupScene(i); resetFx(); buildStatic(); if(viewMode!=='map') build3D(); showBrief(); preloadRadio();}
function restart(){ if(!S) return; setupScene(li); resetFx(); buildStatic(); if(viewMode!=='map') build3D(); game.mode='play'; hideOverlay(); audioInit(); sfx('air'); }

card.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act; audioInit();
  if(a==='pick') load(+b.dataset.i);
  else if(a==='chatter'){save.chatter=!save.chatter; persist(); showMenu(); if(save.chatter) heckle('pullup',true);}
  else if(a==='time'||a==='wx'){
    const c=Object.assign({time:S.T.time,wx:S.T.wx},{[a]:b.dataset.v});
    if(c.time===S.time&&c.wx===S.wx) delete save.cond[L.id]; else save.cond[L.id]=c; persist();
    S.T=makeTheme(c.time,c.wx); resetFx(); buildStatic(); if(viewMode!=='map') build3D(); showBrief();
    const nb=card.querySelector(`[data-act="${a}"][data-v="${b.dataset.v}"]`); if(nb) nb.focus({preventScroll:true});
  }
  else if(a==='start'){game.mode='play'; hideOverlay(); sfx('air');}

function loadRealSounds(){
  if(!AC||SND.p) return;
  const names=['engine-idle','engine-load','reverse-beeper','air-brake','rain','city','highway','bump'];
  SND.p=Promise.all(names.map(n=>fetch('snd/'+n+'.mp3').then(r=>{if(!r.ok) throw 0; return r.arrayBuffer();}).then(ab=>new Promise((ok,no)=>AC.decodeAudioData(ab,ok,no))).then(b=>{SND[n]=b;}).catch(()=>{}))).then(()=>{
    if(!SND['engine-idle']||!SND['engine-load']) return;
    const loopSrc=(buf,gain)=>{const sr=AC.createBufferSource(); sr.buffer=buf; sr.loop=true; const g=AC.createGain(); g.gain.value=0; sr.connect(g).connect(master); sr.start(); return {sr,g:g,gain:g};};

    if(SND['reverse-beeper']) realSnd.beep=loopSrc(SND['reverse-beeper']);

  vbuf[file]=fetch('vo/'+file).then(r=>{if(!r.ok) throw new Error(r.status); return r.arrayBuffer();})
    .then(ab=>new Promise((ok,no)=>AC.decodeAudioData(ab,ok,no))).catch(()=>{delete vbuf[file]; return null;});
  return vbuf[file];
}
function preloadRadio(){
  if(!AC) return; const r=RADIO[regionOf()]||{};
  for(const k in r) r[k].forEach(([,f])=>loadLine(f));
}
function heckle(kind,force){
  if(!save.chatter) return;
  const reg=RADIO[regionOf()], pool=(reg&&reg[kind])||RADIO.yard[kind]; if(!pool) return;
  const now=performance.now()/1000;
  if(!force&&now-heckleAt<6) return;
  heckleAt=now;
  let pick; do{ pick=pool[Math.floor(Math.random()*pool.length)]; }while(pool.length>1&&pick[0]===lastLine[kind]);
  lastLine[kind]=pick[0];
  cbEl.querySelector('.cb-text').textContent=pick[0]; cbEl.hidden=false;
  clearTimeout(cbTimer); cbTimer=setTimeout(()=>{cbEl.hidden=true;},5000);
  if(!AC||!save.sound) return;
  hiss(.2,.08,1300); tone(1500,.05,'square',.03,.18);
  const p=loadLine(pick[1]); if(!p) return;
  p.then(buf=>{
    if(!buf||!save.sound) return;
    try{ if(voiceSrc) voiceSrc.stop(); }catch(e){}
    const src=AC.createBufferSource(), g=AC.createGain(); src.buffer=buf; g.gain.value=1.4;
    src.connect(g).connect(master); const t=AC.currentTime+.22; src.start(t); voiceSrc=src;
    voiceUntil=t+buf.duration;
    src.onended=()=>{ hiss(.12,.05,1300); };
  });
}

function beeper(){
  if(!beepGain) return;
  const rev=game.mode==='play'&&truck.v<-.05;
  if(realSnd&&realSnd.beep){ beepGain.gain.setTargetAtTime(0,AC.currentTime,.01); realSnd.beep.g.gain.setTargetAtTime(rev?.45:0,AC.currentTime,.05); return; }
  const on=rev&&(performance.now()%900)<420;
  beepGain.gain.setTargetAtTime(on?.03:0,AC.currentTime,.006);
}

  scene.updateMatrixWorld(true);
  const bodies={}, wheels=[];
  scene.traverse(o=>{ if(!o.isMesh) return; const b=new THREE.Box3().setFromObject(o);
    const mm=o.name.match(/^(.*?)_[Bb]ody_/); if(mm){ const k=mm[1]; (bodies[k]=bodies[k]||{meshes:[],box:new THREE.Box3()}); bodies[k].meshes.push(o); bodies[k].box.union(b); }

    inner.position.set(-ctr.x,-B.box.min.y,-ctr.z);

    const wrap=new THREE.Group(); wrap.add(turn); wrap.updateMatrixWorld(true);

    addBox(sc,4,40,5.0,5.2,5,9.6,new THREE.MeshStandardMaterial({color:'#ddd',emissive:'#fff6de',emissiveIntensity:T.lights?.9:.2}),false);
    addBox(sc,4,40,5.2,5.8,4.95,5.05,std('#c2372c'));
    for(let x=6;x<40;x+=8) addBox(sc,x,x+.35,0,5.2,7.1,7.45,std('#c9ccce',{metalness:.4}));
  }
}
let fAvg=1/60, qT=0;
function autoQuality(dt){
  if(!R3||!R3.scene||viewMode==='map'||!dt) return;
  fAvg+=(dt-fAvg)*.05; qT+=dt; if(qT<2.5) return; qT=0;
  const q=R3.q==null?2:R3.q;
  if(fAvg>1/24&&q>0){
    R3.q=q-1;
    if(R3.q===1){ R3.renderer.setPixelRatio(1); if(R3.sun){R3.sun.shadow.mapSize.set(1024,1024); if(R3.sun.shadow.map){R3.sun.shadow.map.dispose(); R3.sun.shadow.map=null;}} }
    if(R3.q===0){ R3.renderer.setPixelRatio(.75); if(R3.sun) R3.sun.castShadow=false; if(R3.trees) R3.trees.forEach(t=>t.visible=false); }
    resize3D(); fAvg=1/40;
  }
}
function render3D(ts,dt){
  const r=R3; if(!r||!r.scene) return;
  const T=TH(), [ax,ay]=axle(truck);
  r.tractor.position.set(truck.x,0,truck.y); r.tractor.rotation.y=-truck.th;
  r.trailer.position.set(ax,0,ay); r.trailer.rotation.y=-truck.ph;
  r.tractor.userData.steer.forEach(p=>p.rotation.y=-truck.delta);
  r.dist+=truck.v*dt; for(const w of r.spin){ if(w.ax==='x') w.o.rotation.x=r.dist/w.r; else w.o.rotation.z=-r.dist/w.r; }
  const dark=T.time!=='day'||T.wet||T.fog;
  r.rev.intensity=truck.v<-.02&&dark?1.6:0;
  const braking=truck.v===0||!(keys.r||pedal.r||keys.f||pedal.f);
  r.M.tail.emissiveIntensity=braking?1.4:.5;
  const lampsOn=T.time!=='day'||T.wet||T.fog;
  (r.trailer.userData.tails||[]).forEach(t=>t.material.opacity=lampsOn?(braking?.95:.45):(braking?.35:0));
  (r.heads||[]).forEach(h=>h.material.opacity=lampsOn?.9:0);
  const pulse=reduceMotion?.7:.5+.5*Math.sin(ts/280);
  r.goal[0].opacity=.12+.14*pulse; r.goal[1].opacity=.5+.45*pulse;
  // guide
  const gp=r.guide.geometry.attributes.position; let n=0;
  if(save.guide&&(game.mode==='play'||game.mode==='brief')){const p=projectPath(); for(let i=0;i<p.mid.length&&n<80;i+=2){gp.array[n*3]=p.mid[i][0]; gp.array[n*3+1]=.08; gp.array[n*3+2]=p.mid[i][1]; n++;}}
  gp.needsUpdate=true; r.guide.geometry.setDrawRange(0,n);
  // camera
  const [rx,ry]=rearOf(truck), mx=(truck.x+rx)/2, my=(truck.y+ry)/2, cam=r.cam;
  let pos, look, fov=50;
  if(viewMode==='overhead'){
    const tv=Math.tan(25*DEG), th2=tv*cam.aspect, d=Math.max(30/(2*tv),30/(2*th2));
    pos=new THREE.Vector3(mx,d*.9,my+d*.42); look=new THREE.Vector3(mx,0,my-1); }
  else if(viewMode==='spotter'){
    const Tg=S.target, px=Tg.type==='dock'?Tg.door.x:Tg.p[0], py=Tg.type==='dock'?Tg.door.y:Tg.p[1], an=Tg.type==='dock'?Tg.door.ang:Tg.ang, nx=Math.cos(an), ny=Math.sin(an);
    const inside=(x,y)=>{const q=rect(x,y,0,.6,.6,.6); return S.solids.some(o=>(o.kind==='bldg'||o.kind==='tooth')&&overlap(o.poly,q));};
    let sx=px+nx*1.5, sy=py+ny*1.5;
    for(const [out,side] of [[1.2,0],[2.5,1.5],[4,2.5]]){const x=px+nx*out-ny*side, y=py+ny*out+nx*side; if(!inside(x,y)){sx=x; sy=y; break;}}
    pos=new THREE.Vector3(sx,7.5,sy); look=new THREE.Vector3((rx*2+truck.x)/3,1.5,(ry*2+truck.y)/3); fov=55;
  } else {
    const Gm=cabGeom(truck.style||TRUCKS[0]), U=r.tractor.userData, real=!!U.eyeX, ex0=real?U.eyeX:Gm.w1-.45, [ex,ey]=toWorld(truck,ex0,-.55), [lx,ly]=toWorld(truck,ex0+12,-.4);
    pos=new THREE.Vector3(ex,real?U.eyeY:2.62,ey); look=new THREE.Vector3(lx,real?1.35:1.0,ly); fov=72;
  }
  const k=r.camReady&&viewMode!=='cab'?1-Math.exp(-dt*5):1;
  cam.position.lerp(pos,k); r.look.lerp(look,k); cam.lookAt(r.look); r.camReady=true;
  if(cam.fov!==fov){cam.fov=fov; cam.updateProjectionMatrix();}
  r.sky.position.copy(cam.position);
  // rain and snow fall around the camera
  if(r.precip){const pr=r.precip, a=pr.geometry.attributes.position.array, u=pr.userData;
    pr.position.set(cam.position.x,0,cam.position.z);
    for(let i=0;i<u.n;i++){a[i*3+1]-=u.speed*dt; if(u.snow) a[i*3]+=Math.sin(ts/900+i)*.3*dt; else a[i*3]+=u.speed*.15*dt; if(a[i*3+1]<0){a[i*3+1]+=30; a[i*3]=Math.random()*70-35;}}
    pr.geometry.attributes.position.needsUpdate=true;}
  const R=r.renderer;
  const inCab=viewMode==='cab'; if(inCab&&r.tractor.userData.eyeX&&!r.tractor.userData.showHood) r.tractor.visible=false;
  R.setRenderTarget(null); R.clear(); R.render(r.scene,cam);
  r.tractor.visible=true;
  if(viewMode==='cab'){
    const Gm=cabGeom(truck.style||TRUCKS[0]);
    const [rx,ry]=rearOf(truck), nxp=-Math.sin(truck.ph), nyp=Math.cos(truck.ph), nxt=-Math.sin(truck.th), nyt=Math.cos(truck.th);
    for(const [m,s] of [[r.mL,-1],[r.mR,1]]){
      const U=r.tractor.userData, [mx2,my2]=toWorld(truck,U.mirX||Gm.w1-.12,s*(U.mirZ||1.62)), my3=U.mirY||2.4;
      // aim at this side's back corner of the trailer, nudged outward so the trailer runs down the inner edge;
      // the mirror follows the trailer as it swings, and never turns past straight back or too far out
      const cx=rx+nxp*s*THW, cy=ry+nyp*s*THW; let dx=cx-mx2, dy=cy-my2; const dl=Math.hypot(dx,dy)||1; dx/=dl; dy/=dl;
      const bx=-Math.cos(truck.th), by=-Math.sin(truck.th), ox=s*nxt, oy=s*nyt;
      let along=dx*bx+dy*by, side=dx*ox+dy*oy; side=Math.max(-.02,Math.min(.55,side))+.09; along=Math.max(.5,along);
      let ax=bx*along+ox*side, ay=by*along+oy*side; const al=Math.hypot(ax,ay); ax/=al; ay/=al;
      if(!m.aim) m.aim={x:ax,y:ay}; const kk=Math.min(1,dt*6); m.aim.x+=(ax-m.aim.x)*kk; m.aim.y+=(ay-m.aim.y)*kk;
      m.flat.cam.position.set(mx2,my3,my2); m.flat.cam.lookAt(mx2+m.aim.x*20,.9,my2+m.aim.y*20);
      m.spot.cam.position.set(mx2,my3-.25,my2); m.spot.cam.lookAt(mx2+(m.aim.x+ox*.35)*8,0,my2+(m.aim.y+oy*.35)*8);
      R.setRenderTarget(m.flat.rt); R.clear(); R.render(r.scene,m.flat.cam);
      R.setRenderTarget(m.spot.rt); R.clear(); R.render(r.scene,m.spot.cam);
    }
    R.setRenderTarget(null); R.clearDepth(); R.render(r.hudScene,r.hudCam);
  }
}
// the dashboard in the cab view: gauges and a steering wheel that follow the truck
const SVGNS='http://www.w3.org/2000/svg';
function gauge(id,r,from,to,max,step,label,red){
  const g=document.getElementById(id); if(!g) return; let h=`<circle r="${r}" fill="#15191c" stroke="#3a4147" stroke-width="2"/>`;
  for(let v=0;v<=max;v+=step){const a=(from+(to-from)*v/max-90)*DEG, big=r>25; const r1=r-(big?3:2), r2=r-(big?9:5);
    h+=`<line x1="${Math.cos(a)*r1}" y1="${Math.sin(a)*r1}" x2="${Math.cos(a)*r2}" y2="${Math.sin(a)*r2}" stroke="${red&&v>=red?'#ff5a4e':'#c9d1d6'}" stroke-width="${big?1.6:1.2}"/>`;
    if(big&&v%(step*2)===0) h+=`<text x="${Math.cos(a)*(r-17)}" y="${Math.sin(a)*(r-17)+3}" text-anchor="middle" font-size="8" fill="#9aa6ae" font-family="IBM Plex Mono,monospace">${label==='x100'?v/100:v}</text>`;}
  h+=`<text y="${r*.55}" text-anchor="middle" font-size="${r>25?7:5}" fill="#6f7a82" font-family="IBM Plex Sans,sans-serif">${label==='x100'?'RPM x100':label}</text>`;
  h+=`<line class="nd" x1="0" y1="0" x2="0" y2="${-(r-6)}" stroke="#ff7a2e" stroke-width="${r>25?2.4:1.6}" stroke-linecap="round"/><circle r="${r>25?4:2.5}" fill="#2a2f33"/>`;
  g.innerHTML=h; g.dataset.from=from; g.dataset.to=to; g.dataset.max=max;
}
function needle(id,v){const g=document.getElementById(id); if(!g||!g.dataset.max) return; const f=+g.dataset.from,t=+g.dataset.to,m=+g.dataset.max; const a=f+(t-f)*Math.max(0,Math.min(1,v/m)); g.querySelector('.nd').setAttribute('transform',`rotate(${a})`);}
gauge('gTach',40,-130,130,2500,250,'x100',2100); gauge('gSpeed',40,-130,130,60,5,'MPH'); gauge('gAir',17,-110,110,150,25,'AIR PSI'); gauge('gFuel',13,-100,100,4,1,'FUEL');
const cabhud=$('#cabhud'), gWheel=$('#gWheel'), gGear=$('#gGear'); let airPsi=120;
function updateCab(dt){
  if(cabhud.hidden) return;
  const mph=Math.abs(truck.v)*2.237, rpm=eng?eng.rpm:650+Math.abs(truck.v)*300;
  if(truck.v===0&&game.moving===false) airPsi=Math.max(95,airPsi-0); airPsi=Math.min(125,airPsi+dt*2);
  needle('gTach',rpm); needle('gSpeed',mph); needle('gAir',airPsi); needle('gFuel',3);
  gWheel.setAttribute('transform',`rotate(${truck.delta/MAXD*450} 200 350)`);
  const gear=truck.v<-.05||((keys.r||pedal.r)&&!(keys.f||pedal.f))?'R':truck.v>.05||keys.f||pedal.f?'D':'N';
  if(gGear.textContent!==gear){gGear.textContent=gear; gGear.setAttribute('fill',gear==='R'?'#ff8a7f':gear==='D'?'#3ddc84':'#c9d1d6');}
}
function setView(v){
  if(v!=='map'&&!init3D()) v='map';
  viewMode=v; save.view=v; persist();
  viewBtn.textContent=VIEW_NAMES[v];
  gl.hidden=v==='map'; cv.hidden=v!=='map'; yard.classList.toggle('three',v!=='map'); cabhud.hidden=v!=='cab';
  if(v!=='map') loadVehicles&&R3&&loadVehicles();

}
viewBtn.addEventListener('click',()=>{setView(VIEWS[(VIEWS.indexOf(viewMode)+1)%VIEWS.length]); viewBtn.blur();});

// ---------- loop ----------
let last=0;
function tick(ts){
  const dt=Math.min(.25,last?(ts-last)/1000:0); last=ts;
  if(game.mode==='play'){ let left=dt; while(left>1e-4&&game.mode==='play'){ const h=Math.min(.04,left); left-=h; physics(h); if(game.mode==='play') post(h); } }
  autoQuality(dt);
  if(game.flash>0) game.flash=Math.max(0,game.flash-dt*1.6);

  if(viewMode!=='map'&&R3&&R3.scene){ render3D(ts,dt); updateCab(dt); } else draw(ts);
